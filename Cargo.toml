[package]
name = "enma"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 WITH Commons-Clause"

[lib]
path = "src/lib.rs"

# `server/` is a thin, independently-deployed HTTP/MCP wrapper around this lib
# (mirrors the daruma -> daruma-server pattern). Boundary-clean: validates a
# platform-issued signed token via a configured key, never references mcpbox.
# This makes enma its own deploy unit.
[workspace]
members = ["server"]

[dependencies]
# Self-contained skeleton: NO daruma-* and NO sibling *_oss deps.
# Every primitive (Actor, Timestamp, id newtypes) is local. the host supplies
# any daruma adapters and maps between local and daruma types when
# wiring — implementations live only inside the host, never here.
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid       = { version = "1.10", features = ["v7", "serde"] }
chrono     = { version = "0.4", default-features = false, features = ["serde", "clock"] }
layer-kit  = { git = "https://github.com/tupical/layer-kit" }
