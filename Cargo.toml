[package]
name = "decisions-oss"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 WITH Commons-Clause"

[lib]
path = "src/lib.rs"

[dependencies]
# Shared id newtypes (ProjectId/PlanId/TaskId), Timestamp and the Actor
# domain type, consumed read-only via the vendor/oss symlink → sibling
# taskagent checkout. Mirrors the mcpbox.ru vendoring pattern (see
# vendor/oss in the sibling *-oss crates).
#
# Decisions is a *domain-primitive* layer, not an AI operation — so unlike
# intake-oss / planning-oss / sensemaking-oss it does NOT depend on
# taskagent-ai-infra or taskagent-core. It only needs the shared ids it
# links to and the Actor type it reuses.
taskagent-shared = { path = "vendor/oss/crates/shared" }
taskagent-domain = { path = "vendor/oss/crates/domain" }

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid       = { version = "1.10", features = ["v7", "serde"] }
chrono     = { version = "0.4", default-features = false, features = ["serde", "clock"] }
